<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sonnen-Verlauf -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE047" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Wolken-Verlauf (WetterOnline-typischer leichter Graustich unten) -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0F4F8" />
      <stop offset="100%" stop-color="#D4DEE8" />
    </linearGradient>

    <!-- Regentropfen-Verlauf -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <!-- Dezenter Schatten für die Wolke -->
    <filter id="cloudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sonne (oben links, teilweise verdeckt) -->
  <g id="sun">
    <!-- Sonnenstrahlen -->
    <g stroke="#FFB300" stroke-width="2.5" stroke-linecap="round">
      <line x1="22" y1="6" x2="22" y2="10" />
      <line x1="10.7" y1="10.7" x2="13.5" y2="13.5" />
      <line x1="6" y1="22" x2="10" y2="22" />
      <line x1="10.7" y1="33.3" x2="13.5" y2="30.5" />
      <line x1="33.3" y1="10.7" x2="30.5" y2="13.5" />
    </g>
    <!-- Sonnenkern -->
    <circle cx="22" cy="22" r="9.5" fill="url(#sunGrad)" />
  </g>

  <!-- Wolke -->
  <path id="cloud" d="M47.5,43 H18.5 C13.25,43 9,38.75 9,33.5 C9,28.6 12.7,24.55 17.5,24.05 C19.2,17.7 25,13 32,13 C39.8,13 46.2,18.9 46.9,26.5 C51.4,27.3 55,31.2 55,36 C55,40.4 51.6,43 47.5,43 Z" fill="url(#cloudGrad)" stroke="#C5D2DF" stroke-width="0.75" filter="url(#cloudShadow)" />

  <!-- 3 Regentropfen (ergiebiger Regen, leicht schräg) -->
  <g id="raindrops" fill="url(#rainGrad)">
    <!-- Tropfen 1 (links) -->
    <path d="M23.5,47.5 C23.5,47.5 19.5,53.2 19.5,55.8 C19.5,58.0 21.3,59.8 23.5,59.8 C25.7,59.8 27.5,58.0 27.5,55.8 C27.5,53.2 23.5,47.5 23.5,47.5 Z" transform="rotate(14 23.5 54)" />
    <!-- Tropfen 2 (mitte, leicht tiefer) -->
    <path d="M33.5,48.5 C33.5,48.5 29.5,54.2 29.5,56.8 C29.5,59.0 31.3,60.8 33.5,60.8 C35.7,60.8 37.5,59.0 37.5,56.8 C37.5,54.2 33.5,48.5 33.5,48.5 Z" transform="rotate(14 33.5 55)" />
    <!-- Tropfen 3 (rechts) -->
    <path d="M43.5,47.5 C43.5,47.5 39.5,53.2 39.5,55.8 C39.5,58.0 41.3,59.8 43.5,59.8 C45.7,59.8 47.5,58.0 47.5,55.8 C47.5,53.2 43.5,47.5 43.5,47.5 Z" transform="rotate(14 43.5 54)" />
  </g>
</svg>